name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release versions
        shell: pwsh
        run: |
          $guiVersion = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          $tagVersion = ('${{ github.ref_name }}').Substring(1)
          if ($tagVersion -ne $guiVersion) {
            throw "Tag $tagVersion does not match GUI version $guiVersion"
          }
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          if ($cliVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid CLI_VERSION: $cliVersion"
          }

      - name: Test and build core
        shell: pwsh
        run: |
          go test ./...
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          go build -trimpath -ldflags "-s -w -X main.Version=$cliVersion" -o tunnelx-cli.exe ./cmd/tunnelx-cli

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: |
          if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD -or !$env:TUNNELX_PUBLISHER_NAME) {
            throw 'Configure CSC_LINK, CSC_KEY_PASSWORD secrets and exact TUNNELX_PUBLISHER_NAME before publishing.'
          }

      - name: Check desktop security boundaries
        working-directory: desktop
        run: npm run test:security

      - name: Create release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --verify-tag --generate-notes --title "TunnelX ${{ github.ref_name }}"
          }

      - name: Publish signed NSIS release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: npm run package:signed -- --publish always
