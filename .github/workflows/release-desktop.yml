name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release versions
        shell: pwsh
        run: |
          $guiVersion = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          $tagVersion = ('${{ github.ref_name }}').Substring(1)
          if ($tagVersion -ne $guiVersion) {
            throw "Tag $tagVersion does not match GUI version $guiVersion"
          }
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          if ($cliVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid CLI_VERSION: $cliVersion"
          }

      - name: Test and build core
        shell: pwsh
        run: |
          go test ./...
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          go build -trimpath -ldflags "-s -w -X main.Version=$cliVersion" -o tunnelx-cli.exe ./cmd/tunnelx-cli

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Create release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --verify-tag --generate-notes --title "TunnelX ${{ github.ref_name }}"
          }

      - name: Publish unsigned NSIS release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --publish always
