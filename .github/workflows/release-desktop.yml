name: Release Windows and Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-connection:
    uses: ./.github/workflows/linux-connection.yml

  release:
    needs: linux-connection
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release versions
        shell: pwsh
        run: |
          $guiVersion = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($tagVersion -ne $guiVersion) {
            throw "Tag $tagVersion does not match GUI version $guiVersion"
          }
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          if ($cliVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid CLI_VERSION: $cliVersion"
          }
          $notesPath = Join-Path '.github/release-notes' "$env:RELEASE_TAG.md"
          if (!(Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }

      - name: Test and build core
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          go build -trimpath -ldflags "-s -w -X main.Version=$cliVersion" -o tunnelx-cli.exe ./cmd/tunnelx-cli

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Require Windows signing credentials
        if: vars.TUNNELX_SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: |
          if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD -or !$env:TUNNELX_PUBLISHER_NAME) {
            throw 'Configure CSC_LINK, CSC_KEY_PASSWORD secrets and exact TUNNELX_PUBLISHER_NAME before publishing.'
          }

      - name: Check desktop security boundaries
        working-directory: desktop
        run: npm run test:security

      - name: Create release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesPath = Join-Path '.github/release-notes' "$env:RELEASE_TAG.md"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --notes-file $notesPath
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --notes-file $notesPath --title "TunnelX $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish signed NSIS release
        if: vars.TUNNELX_SIGN_WINDOWS == 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: npm run package:signed -- --publish always

      - name: Publish unsigned Windows release
        if: vars.TUNNELX_SIGN_WINDOWS != 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --publish always

  release-linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Build and test embedded admin UI
        working-directory: admin-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build Linux amd64 and arm64 packages
        run: bash .github/scripts/build-linux-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/linux-release"
      - name: Test packaged amd64 binaries
        env:
          TUNNELX_TEST_BIN_DIR: ${{ runner.temp }}/linux-package-test
        run: |
          set -euo pipefail
          mkdir -p "$TUNNELX_TEST_BIN_DIR"
          tar -xzf "$RUNNER_TEMP/linux-release/TunnelX-${RELEASE_TAG#v}-linux-amd64.tar.gz" -C "$TUNNELX_TEST_BIN_DIR"
          version="$(tr -d '\r\n' < CLI_VERSION)"
          test "$("$TUNNELX_TEST_BIN_DIR/tunnelx-cli" version)" = "$version"
          test "$("$TUNNELX_TEST_BIN_DIR/tunnel-server" -version)" = "tunnel-server $version"
          go test -tags=integration ./integration -v -count=1 -timeout=3m
      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/linux-release"
          sha256sum --check SHA256SUMS-linux.txt
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            TunnelX-*-linux-amd64.tar.gz TunnelX-*-linux-arm64.tar.gz SHA256SUMS-linux.txt
