name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-connection:
    uses: ./.github/workflows/linux-connection.yml

  release:
    needs: linux-connection
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release versions
        shell: pwsh
        run: |
          $guiVersion = (Get-Content -Raw desktop/package.json | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($tagVersion -ne $guiVersion) {
            throw "Tag $tagVersion does not match GUI version $guiVersion"
          }
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          if ($cliVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid CLI_VERSION: $cliVersion"
          }
          $notesPath = Join-Path '.github/release-notes' "$env:RELEASE_TAG.md"
          if (!(Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }

      - name: Test and build core
        shell: pwsh
        run: |
          go test ./...
          $cliVersion = (Get-Content -Raw CLI_VERSION).Trim()
          go build -trimpath -ldflags "-s -w -X main.Version=$cliVersion" -o tunnelx-cli.exe ./cmd/tunnelx-cli

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Require Windows signing credentials
        if: vars.TUNNELX_SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: |
          if (!$env:CSC_LINK -or !$env:CSC_KEY_PASSWORD -or !$env:TUNNELX_PUBLISHER_NAME) {
            throw 'Configure CSC_LINK, CSC_KEY_PASSWORD secrets and exact TUNNELX_PUBLISHER_NAME before publishing.'
          }

      - name: Check desktop security boundaries
        working-directory: desktop
        run: npm run test:security

      - name: Create release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesPath = Join-Path '.github/release-notes' "$env:RELEASE_TAG.md"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:RELEASE_TAG --notes-file $notesPath
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --notes-file $notesPath --title "TunnelX $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish signed NSIS release
        if: vars.TUNNELX_SIGN_WINDOWS == 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          TUNNELX_PUBLISHER_NAME: ${{ vars.TUNNELX_PUBLISHER_NAME }}
        run: npm run package:signed -- --publish always

      - name: Publish unsigned Windows release
        if: vars.TUNNELX_SIGN_WINDOWS != 'true'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --publish always
