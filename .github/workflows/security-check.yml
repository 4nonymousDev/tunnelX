name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./internal/server ./internal/session ./internal/policy ./internal/store
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/tunnel-server ./cmd/tunnel-server
      - run: bash -n deploy/install.sh deploy/upgrade.sh
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Scan source and history for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --no-banner --redact --log-opts=--all .
          gitleaks dir --no-banner --redact .
