name: Linux server connection test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build Linux server and CLI
        shell: bash
        env:
          TUNNELX_TEST_BIN_DIR: ${{ runner.temp }}/tunnelx-connection-bin
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < CLI_VERSION)"
          mkdir -p "$TUNNELX_TEST_BIN_DIR"
          go build -trimpath -ldflags "-X main.Version=$version" -o "$TUNNELX_TEST_BIN_DIR/tunnel-server" ./cmd/tunnel-server
          go build -trimpath -ldflags "-X main.Version=$version" -o "$TUNNELX_TEST_BIN_DIR/tunnelx-cli" ./cmd/tunnelx-cli
      - name: Connect two real CLI processes through the Linux server
        env:
          TUNNELX_TEST_BIN_DIR: ${{ runner.temp }}/tunnelx-connection-bin
        run: go test -tags=integration ./integration -v -count=1 -timeout=3m
